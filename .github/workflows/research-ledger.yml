name: research-ledger

on:
  pull_request:
    paths:
      - "research_ledger/**"
      - "tools/run_temporal_change_baselines.py"
      - "tests/test_research_ledger.py"
      - "tests/test_temporal_baseline_ledger_cli.py"
      - ".github/workflows/research-ledger.yml"

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pillow pytest ruff
      - run: python -m compileall -q research_ledger tools/run_temporal_change_baselines.py
      - run: pytest -q tests/test_research_ledger.py tests/test_temporal_baseline_ledger_cli.py
      - run: ruff check research_ledger tools/run_temporal_change_baselines.py tests/test_research_ledger.py tests/test_temporal_baseline_ledger_cli.py
