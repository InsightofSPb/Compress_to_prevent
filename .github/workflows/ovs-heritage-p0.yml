name: ovs-heritage-p0

on:
  pull_request:
    paths:
      - "ovs_heritage/**"
      - "segmentation/evaluation/lposs_eval.py"
      - "tools/check_stock_lposs_gpu.py"
      - "tools/run_official_lposs_parity.py"
      - ".github/workflows/ovs-heritage-p0.yml"
      - "environment.yml"
  push:
    branches: ["codex/-p0"]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==1.12.1 numpy==1.26.4 pillow==10.4.0 pyyaml==6.0.2 pycocotools==2.0.8 pytest==8.3.3 ruff==0.6.9
      - run: python -m compileall -q ovs_heritage segmentation/evaluation/lposs_eval.py tools/check_stock_lposs_gpu.py tools/run_official_lposs_parity.py
      - run: pytest -q ovs_heritage/tests
      - run: ruff check ovs_heritage segmentation/evaluation/lposs_eval.py tools/check_stock_lposs_gpu.py tools/run_official_lposs_parity.py
